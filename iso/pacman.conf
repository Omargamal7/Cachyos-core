# pacman.conf used by mkarchiso when it populates the live filesystem.
# This is NOT the pacman.conf that ends up on the installed system -- that one
# comes from airootfs/etc/pacman.conf.

[options]
HoldPkg      = pacman glibc
Architecture = auto
CheckSpace
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
ParallelDownloads = 5

# Our own packages: the kernel, plus the AUR builds (Chrome, mbpfan). Built
# into out/localrepo by iso/build.sh. Listed first so it wins any name clash.
[mba62]
SigLevel = Optional TrustAll
Server = file:///tmp/mba62-localrepo

[cachyos]
Server = https://mirror.cachyos.org/repo/$arch/$repo

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
