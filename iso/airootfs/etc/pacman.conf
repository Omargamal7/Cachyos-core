# pacman.conf for the installed system.
[options]
HoldPkg     = pacman glibc
Architecture = auto
Color
CheckSpace
VerbosePkgLists
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[cachyos]
Server = https://mirror.cachyos.org/repo/$arch/$repo

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# The kernel and the other packages built for this laptop are not in any
# public repo -- they are attached to this project's GitHub releases. Update
# them with `sudo mba62-update`, which fetches the latest release and installs
# it with `pacman -U`. See /usr/local/bin/mba62-update.
