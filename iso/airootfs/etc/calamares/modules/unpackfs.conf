# Copy the live filesystem to the target, then drop our kernel image in.
# The paths are where archiso mounts the boot medium and where mkarchiso
# places the kernel it took from /boot in the airootfs.
---
unpack:
    -   source: "/run/archiso/bootmnt/arch/x86_64/airootfs.sfs"
        sourcefs: "squashfs"
        destination: ""
    -   source: "/run/archiso/bootmnt/arch/boot/x86_64/vmlinuz-linux-cachyos-bore-mba62"
        sourcefs: "file"
        destination: "/boot/vmlinuz-linux-cachyos-bore-mba62"
