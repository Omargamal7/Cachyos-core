# GRUB rather than systemd-boot, installed to the EFI fallback path as well.
#
# Apple's firmware only reliably lists an entry from its Startup Manager
# (the boot picker you get by holding Option) when the loader is at
# \EFI\BOOT\BOOTX64.EFI. installEFIFallback puts it there in addition to the
# vendor directory, which is what makes this bootable on a Mac.
---
efiBootLoader: "grub"
kernelSearchPath: "/usr/lib/modules"
kernelPattern: "^vmlinuz.*"
kernelParams: [ "quiet", "rw" ]
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
efiBootloaderId: "cachyos-core"
installEFIFallback: true
