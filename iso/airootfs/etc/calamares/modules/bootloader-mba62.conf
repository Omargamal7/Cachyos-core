# GRUB rather than systemd-boot, installed to the EFI fallback path as well.
#
# Apple's firmware only reliably lists an entry from its Startup Manager
# (the boot picker you get by holding Option) when the loader is at
# \EFI\BOOT\BOOTX64.EFI. installEFIFallback puts it there in addition to the
# vendor directory, which is what makes this bootable on a Mac.
---
efiBootLoader: "grub"
kernelSearchPath: "/usr/lib/modules"
kernelPattern: "^vmlinuz.*"
# Kernel command line for the *installed* system. Every entry here can be
# undone from the GRUB menu at boot (press `e`, edit the line, Ctrl-X) without
# reinstalling or rebuilding anything, which is what makes this the right place
# to make these choices rather than the kernel config.
#
#   mitigations=off   Turns off the CPU vulnerability mitigations -- Spectre,
#                     Meltdown, MDS, L1TF and the rest. Haswell pays for these
#                     in every syscall and context switch, and this is a
#                     single-user laptop, so the trade is taken deliberately.
#                     Requires CONFIG_CPU_MITIGATIONS=y, which the base config
#                     sets. **Delete this word to get every mitigation back.**
#                     See docs/HARDWARE.md for what that exposes.
#
#   zswap.enabled=0   The CachyOS base config sets CONFIG_ZSWAP_DEFAULT_ON=y.
#                     Swap here is zram, so leaving zswap on would compress
#                     pages into a pool in front of a device that compresses
#                     them again. mm/Kconfig names this parameter as the
#                     documented override.
#
#   nowatchdog        Drops the soft-lockup and NMI hard-lockup detectors.
kernelParams: [ "quiet", "rw", "mitigations=off", "zswap.enabled=0", "nowatchdog" ]
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
efiBootloaderId: "cachyos-core"
installEFIFallback: true
