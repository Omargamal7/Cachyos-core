# Calamares settings for the MacBookAir6,2 image.
#
# Offline install: the unpackfs module copies this live filesystem onto the
# target disk, so the installed system is byte-for-byte what you booted --
# our kernel, the Openbox desktop, the Wi-Fi module, all of it. No network,
# no package selection, nothing to get wrong at install time.
#
# Based on CachyOS's settings_offline.conf, with the modules we have no use
# for removed: no ZFS, no display manager, no ufw, no systemd-boot hooks.
---
modules-search: [ local ]

instances:
- id:       offline
  module:   packages
  config:   packages_offline.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - luksbootkeyfile
  - luksopenswaphookcfg
  - initcpiocfg
  - initcpio
  - removeuser
  - users
  - networkcfg
  - packages@offline
  - hwclock
  - bootloader
  - services-systemd
  - umount
- show:
  - finished

branding: cachyos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: true
quit-at-end: false
