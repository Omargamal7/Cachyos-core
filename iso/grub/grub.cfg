# GRUB menu for the live image. This laptop is 64-bit EFI only, so there is no
# BIOS path to cater for.

insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660

insmod font
if loadfont "${prefix}/fonts/unicode.pf2"; then
    insmod all_video
    set gfxmode="auto"
    terminal_input console
    terminal_output gfxterm
fi

set default=0
set timeout=10
set timeout_style=menu

# zswap.enabled=0: the image carries a zram swap configuration, and the base
# config has CONFIG_ZSWAP_DEFAULT_ON=y -- without this the live session would
# compress pages twice. The installed system gets its own command line from
# /etc/calamares/modules/bootloader-mba62.conf; this one only affects the live
# session, which stays otherwise stock on purpose.
menuentry "Install CachyOS-core (MacBookAir6,2)" --class arch --class gnu-linux --class gnu --class os --id 'mba62' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos-bore-mba62 archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=4G copytoram=auto module_blacklist=pcspkr zswap.enabled=0
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos-bore-mba62.img
}

# If the panel stays black past the GRUB menu, this drops modesetting so you
# at least reach a usable console.
menuentry "Install CachyOS-core (safe graphics)" --class arch --class gnu-linux --class gnu --class os --id 'mba62-nomodeset' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos-bore-mba62 archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=4G copytoram=auto module_blacklist=pcspkr zswap.enabled=0 nomodeset
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos-bore-mba62.img
}

menuentry "Boot the disk already installed" --id 'localdisk' {
    exit
}

if [ "${grub_platform}" == 'efi' ]; then
    menuentry "UEFI Firmware Settings" --id 'uefi-firmware' {
        fwsetup
    }
fi
