# ---------------------------------------------------------------------------
# prune-rules.conf -- "disable every driver matching X, except these"
#
# 10-strip.conf switches off whole subsystems by their gate symbol. That does
# not help where a subsystem we *do* need ships hundreds of chip drivers
# alongside the one chip this laptop has -- 194 hwmon drivers, 118 HID
# drivers, 69 RTCs. Those are what these rules are for.
#
# Format:  <glob>  [symbol-to-keep ...]
# Globs are shell globs over the symbol name with CONFIG_ stripped.
#
# Anything 20-mba62.conf or 30-tuning.conf turns on is kept automatically,
# so the hardware allowlist stays the single source of truth and these
# keep-lists only cover infrastructure symbols with no prompt of their own.
# ---------------------------------------------------------------------------

# Sensors: the SMC reports this machine's temperatures and fans, coretemp the
# CPU package. The other ~250 are I2C chips on server boards.
SENSORS_*           SENSORS_APPLESMC SENSORS_CORETEMP
PMBUS*
*_PMBUS

# HID: Apple keyboard, generic, and a couple of common external devices.
HID_*               HID_APPLE HID_GENERIC HID_MULTITOUCH HID_MAGICMOUSE HID_LOGITECH HID_LOGITECH_HIDPP HID_BATTERY_STRENGTH HID_SUPPORT

# Regulators, MFDs, GPIO expanders: embedded-board plumbing.
REGULATOR_*
MFD_*
GPIO_*
PINCTRL_*

# Real-time clocks: the PC CMOS clock is the only one here.
RTC_DRV_*           RTC_DRV_CMOS

# Traffic shaping and classification beyond the default queue discipline.
NET_SCH_*           NET_SCH_FQ_CODEL NET_SCH_FQ
NET_ACT_*
NET_CLS_*
NET_EMATCH*
NET_DSA*

# Ethernet PHYs -- no built-in NIC, and USB adapters pull their own.
*_PHY                MDIO_DEVICE
MDIO_*
PHY_*

# Battery-charger chips: ACPI handles this machine's battery.
CHARGER_*
BATTERY_*
*_BATTERY

# Watchdogs: the Intel TCO watchdog is the one on this chipset.
*_WDT               ITCO_WDT
WATCHDOG_*

# LED and backlight controller chips (the keyboard backlight is an applesmc
# LED; the panel backlight is i915's).
LEDS_*              LEDS_CLASS LEDS_TRIGGERS
BACKLIGHT_*

# I2C bus drivers: Lynx Point's SMBus controller only.
I2C_*               I2C_I801 I2C_SMBUS I2C_ALGOBIT I2C_CHARDEV

# Device-mapper targets beyond dm-crypt, and the MD RAID personalities.
DM_*                DM_CRYPT DM_BUFIO
MD_*

# HD-audio codecs: this machine has a Cirrus CS4208 and an Intel HDMI codec.
SND_HDA_CODEC_*     SND_HDA_CODEC_CIRRUS SND_HDA_CODEC_HDMI SND_HDA_CODEC_GENERIC
SND_SOC_*
SND_USB_*           SND_USB_AUDIO
SND_PCI*

