# ---------------------------------------------------------------------------
# 10-strip.conf -- subsystem deny-list
#
# Turns off whole subsystems that a MacBookAir6,2 running Openbox + Chrome
# has no use for. These are *gate* symbols: switching one off makes
# `make olddefconfig` drop every driver underneath it, which is what does the
# real work (the stock CachyOS config ships ~6200 modules).
#
# Anything this file gets wrong is caught by kernel/verify-config.sh, which
# re-checks the required symbols after olddefconfig has run.
# ---------------------------------------------------------------------------

