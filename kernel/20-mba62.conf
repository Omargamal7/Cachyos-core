# ---------------------------------------------------------------------------
# 20-mba62.conf -- MacBookAir6,2 hardware allowlist
#
# Applied *after* 10-strip.conf, so anything here wins over the deny-list.
# Boot-critical drivers are built in (=y) so the machine comes up without
# depending on an initramfs; everything else stays modular.
#
# Machine: MacBookAir6,2 (13-inch, Mid 2013 / Early 2014)
#   CPU     Intel Haswell-ULT (i5-4250U / i5-4260U / i7-4650U)
#   GPU     Intel HD Graphics 5000 (Haswell GT3)  -> i915
#   Storage PCIe SSD behind AHCI                  -> ahci  (+ nvme if swapped)
#   Audio   Intel Lynx Point-LP HDA, Cirrus CS4208 -> snd_hda_codec_cirrus
#   Wi-Fi   Broadcom BCM4360 (14e4:43a0)          -> out-of-tree broadcom-wl
#   BT      Broadcom BCM20702                     -> btusb
#   Input   Apple USB keyboard + Wellspring8 trackpad -> hid_apple, bcm5974
#   Webcam  FaceTime HD (Broadcom 1570)           -> out-of-tree facetimehd
#   Sensors Apple SMC (temps, fans, keyboard backlight) -> applesmc
# ---------------------------------------------------------------------------

# --- Platform ---------------------------------------------------------------
CONFIG_X86_64=y
CONFIG_SMP=y
CONFIG_NR_CPUS=8
CONFIG_PCI=y
CONFIG_PCIEPORTBUS=y
CONFIG_PCIEASPM=y
CONFIG_PCIEASPM_POWERSAVE=y
CONFIG_ACPI=y
CONFIG_ACPI_AC=y
CONFIG_ACPI_BATTERY=y
CONFIG_ACPI_BUTTON=y
CONFIG_ACPI_VIDEO=y
CONFIG_ACPI_THERMAL=y
CONFIG_APPLE_PROPERTIES=y

# --- Firmware / boot --------------------------------------------------------
CONFIG_EFI=y
CONFIG_EFI_STUB=y
CONFIG_EFI_VARS_PSTORE=m
CONFIG_EFIVAR_FS=y
CONFIG_FW_LOADER=y
CONFIG_SYSFB_SIMPLEFB=y
CONFIG_DMIID=y

# --- Power / frequency ------------------------------------------------------
CONFIG_CPU_FREQ=y
CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y
CONFIG_CPU_FREQ_GOV_PERFORMANCE=y
CONFIG_CPU_FREQ_GOV_POWERSAVE=y
CONFIG_X86_INTEL_PSTATE=y
CONFIG_CPU_IDLE=y
CONFIG_INTEL_IDLE=y
CONFIG_PM=y
CONFIG_PM_SLEEP=y
CONFIG_SUSPEND=y
CONFIG_HIBERNATION=y
CONFIG_INTEL_RAPL=m
CONFIG_INTEL_POWERCLAMP=m
CONFIG_X86_INTEL_LPSS=y

# --- Thermals and sensors ---------------------------------------------------
CONFIG_HWMON=y
CONFIG_SENSORS_APPLESMC=m
CONFIG_SENSORS_CORETEMP=m
CONFIG_THERMAL=y
CONFIG_X86_PKG_TEMP_THERMAL=m

# --- Graphics: Intel HD 5000 (built in, needs no firmware on Haswell) -------
CONFIG_DRM=y
CONFIG_DRM_I915=y
CONFIG_DRM_I915_CAPTURE_ERROR=y
CONFIG_DRM_I915_USERPTR=y
CONFIG_DRM_SIMPLEDRM=y
CONFIG_DRM_FBDEV_EMULATION=y
CONFIG_FRAMEBUFFER_CONSOLE=y
CONFIG_FRAMEBUFFER_CONSOLE_DETECT_PRIMARY=y
CONFIG_BACKLIGHT_CLASS_DEVICE=y

# --- Storage: PCIe SSD behind AHCI, plus NVMe for aftermarket swaps ---------
CONFIG_ATA=y
CONFIG_SATA_AHCI=y
CONFIG_SATA_MOBILE_LPM_POLICY=3
CONFIG_SCSI=y
CONFIG_BLK_DEV_SD=y
CONFIG_BLK_DEV_NVME=y
CONFIG_NVME_CORE=y
CONFIG_BLK_DEV_LOOP=y
CONFIG_BLK_DEV_DM=y
# dm-crypt is capped at =m by its dependency on ENCRYPTED_KEYS, which is
# itself modular. A LUKS root needs an initramfs for the passphrase prompt
# anyway, and mkinitcpio's encrypt/sd-encrypt hook pulls the module in.
CONFIG_DM_CRYPT=m
CONFIG_MD=y

# The SDXC slot on this model is USB-attached, but a small PCIe Realtek
# reader is cheap insurance if yours is not -- see docs/HARDWARE.md.
CONFIG_MISC_RTSX_PCI=m
CONFIG_MMC=m
CONFIG_MMC_BLOCK=m
CONFIG_MMC_REALTEK_PCI=m

# --- USB --------------------------------------------------------------------
CONFIG_USB_SUPPORT=y
CONFIG_USB=y
CONFIG_USB_XHCI_HCD=y
CONFIG_USB_XHCI_PCI=y
CONFIG_USB_EHCI_HCD=y
CONFIG_USB_EHCI_PCI=y
CONFIG_USB_STORAGE=y
CONFIG_USB_UAS=y
CONFIG_USB_ACM=m
CONFIG_USB4=m

# --- Input: Apple keyboard + Wellspring8 trackpad ---------------------------
CONFIG_INPUT=y
CONFIG_INPUT_EVDEV=y
CONFIG_INPUT_MOUSEDEV=y
CONFIG_INPUT_KEYBOARD=y
CONFIG_INPUT_MOUSE=y
CONFIG_MOUSE_BCM5974=y
CONFIG_HID=y
CONFIG_HID_GENERIC=y
CONFIG_USB_HID=y
CONFIG_HID_APPLE=y
CONFIG_HID_MULTITOUCH=m
CONFIG_HID_MAGICMOUSE=m
CONFIG_SERIO=y
CONFIG_SERIO_I8042=y
CONFIG_KEYBOARD_ATKBD=y

# --- Audio: Intel HDA with the Cirrus CS4208 codec --------------------------
CONFIG_SOUND=m
CONFIG_SND=m
CONFIG_SND_PCM=m
CONFIG_SND_HDA_INTEL=m
CONFIG_SND_HDA_GENERIC=m
CONFIG_SND_HDA_CODEC_CIRRUS=m
CONFIG_SND_HDA_CODEC_CS420X=m
CONFIG_SND_HDA_CODEC_HDMI=m
CONFIG_SND_HDA_PREALLOC_SIZE=2048
CONFIG_SND_USB_AUDIO=m
CONFIG_SND_SEQUENCER=m
CONFIG_SND_HRTIMER=m

# --- Camera: facetimehd is out-of-tree but needs the V4L2 core in place -----
CONFIG_MEDIA_SUPPORT=m
CONFIG_MEDIA_CAMERA_SUPPORT=y
CONFIG_VIDEO_DEV=m
CONFIG_VIDEOBUF2_CORE=m
CONFIG_VIDEOBUF2_V4L2=m
CONFIG_VIDEOBUF2_DMA_SG=m
CONFIG_MEDIA_USB_SUPPORT=y
CONFIG_USB_VIDEO_CLASS=m
# VIDEOBUF2_DMA_SG has no prompt of its own -- it only ever gets
# selected by a capture driver. ipu3-cio2 is the cheapest x86 selector, so
# it is enabled purely to make videobuf2-dma-sg.ko exist for facetimehd.
CONFIG_MEDIA_PCI_SUPPORT=y
CONFIG_VIDEO_IPU3_CIO2=m

# --- Wi-Fi: cfg80211 only; BCM4360 is driven by out-of-tree broadcom-wl -----
# brcmfmac is kept as a module purely as a fallback for the 43602-based cards
# some units were serviced with. mac80211 stays off (see 10-strip.conf).
CONFIG_WIRELESS=y
CONFIG_CFG80211=m
CONFIG_CFG80211_WEXT=y
CONFIG_RFKILL=m
CONFIG_RFKILL_INPUT=y
CONFIG_WLAN=y
CONFIG_WLAN_VENDOR_BROADCOM=y
CONFIG_BRCMUTIL=m
CONFIG_BRCMFMAC=m
CONFIG_BRCMFMAC_PROTO_MSGBUF=y
CONFIG_BRCMFMAC_PCIE=y

# --- Bluetooth: BCM20702 over USB -------------------------------------------
CONFIG_BT=m
CONFIG_BT_BREDR=y
CONFIG_BT_LE=y
CONFIG_BT_RFCOMM=m
CONFIG_BT_HIDP=m
CONFIG_BT_HCIBTUSB=m
CONFIG_BT_HCIBTUSB_BCM=y

# --- USB networking: dongles and phone tethering ----------------------------
CONFIG_NET=y
CONFIG_USB_NET_DRIVERS=m
CONFIG_USB_USBNET=m
CONFIG_USB_NET_CDCETHER=m
CONFIG_USB_NET_CDC_NCM=m
CONFIG_USB_NET_AX8817X=m
CONFIG_USB_NET_AX88179_178A=m
CONFIG_USB_RTL8152=m
CONFIG_USB_NET_RNDIS_HOST=m
CONFIG_USB_IPHETH=m

# --- Networking core --------------------------------------------------------
CONFIG_INET=y
CONFIG_IPV6=y
CONFIG_PACKET=y
CONFIG_UNIX=y
CONFIG_TUN=m
CONFIG_BRIDGE=m
CONFIG_VETH=m
CONFIG_WIREGUARD=m
CONFIG_NETFILTER=y
# CONFIG_NETFILTER_ADVANCED is not set
CONFIG_NF_CONNTRACK=m
CONFIG_NF_TABLES=m
CONFIG_NF_TABLES_INET=y
CONFIG_NFT_CT=m
CONFIG_NFT_NAT=m
CONFIG_NF_NAT=m
CONFIG_NFT_COMPAT=m

# --- Filesystems ------------------------------------------------------------
CONFIG_EXT4_FS=y
CONFIG_EXT4_FS_POSIX_ACL=y
CONFIG_BTRFS_FS=y
CONFIG_BTRFS_FS_POSIX_ACL=y
CONFIG_VFAT_FS=y
CONFIG_FAT_DEFAULT_UTF8=y
CONFIG_EXFAT_FS=m
CONFIG_HFSPLUS_FS=m
CONFIG_ISO9660_FS=m
CONFIG_UDF_FS=m
CONFIG_FUSE_FS=y
CONFIG_OVERLAY_FS=m
CONFIG_SQUASHFS=m
CONFIG_TMPFS=y
CONFIG_TMPFS_POSIX_ACL=y
CONFIG_TMPFS_XATTR=y
CONFIG_AUTOFS_FS=y
CONFIG_PROC_FS=y
CONFIG_SYSFS=y
CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y
CONFIG_NLS_CODEPAGE_437=y
CONFIG_NLS_ISO8859_1=y
CONFIG_NLS_UTF8=y

# --- Userspace contract: systemd, Chrome's sandbox, containers --------------
CONFIG_NAMESPACES=y
CONFIG_UTS_NS=y
CONFIG_IPC_NS=y
CONFIG_PID_NS=y
CONFIG_NET_NS=y
CONFIG_USER_NS=y
CONFIG_CGROUPS=y
CONFIG_CGROUP_BPF=y
CONFIG_MEMCG=y
CONFIG_CGROUP_SCHED=y
CONFIG_CGROUP_FREEZER=y
CONFIG_CPUSETS=y
CONFIG_SECCOMP=y
CONFIG_SECCOMP_FILTER=y
CONFIG_BPF_SYSCALL=y
CONFIG_INOTIFY_USER=y
CONFIG_FANOTIFY=y
CONFIG_SIGNALFD=y
CONFIG_TIMERFD=y
CONFIG_EPOLL=y
CONFIG_EVENTFD=y
CONFIG_FHANDLE=y
CONFIG_UNIX98_PTYS=y
CONFIG_POSIX_MQUEUE=y
CONFIG_SYSVIPC=y
CONFIG_IA32_EMULATION=y

# --- Crypto: what LUKS, module signing and WireGuard actually use -----------
CONFIG_CRYPTO_USER_API_HASH=m
CONFIG_CRYPTO_USER_API_SKCIPHER=m
CONFIG_CRYPTO_HMAC=y
CONFIG_CRYPTO_SHA256=y
CONFIG_CRYPTO_SHA512=y
CONFIG_CRYPTO_AES=y
CONFIG_CRYPTO_XTS=y
CONFIG_CRYPTO_AES_NI_INTEL=y
CONFIG_CRYPTO_LIB_SHA256_ARCH=y
CONFIG_CRYPTO_CRC32C=y
CONFIG_CRYPTO_CHACHA20POLY1305=m
CONFIG_CRYPTO_LIB_CURVE25519=m

# --- Memory / swap ----------------------------------------------------------
CONFIG_ZRAM=m
CONFIG_ZRAM_DEF_COMP_ZSTD=y
CONFIG_ZSWAP=y
CONFIG_TRANSPARENT_HUGEPAGE=y
