# ---------------------------------------------------------------------------
# 30-tuning.conf -- build-size, scheduler and out-of-tree-module settings
#
# Applied last, so it wins over both the deny-list and the hardware allowlist.
# ---------------------------------------------------------------------------

# --- BORE ------------------------------------------------------------------
# Supplied by kernel-patches' 0001-bore-cachy.patch; see kernel/PKGBUILD.
CONFIG_SCHED_BORE=y
CONFIG_MIN_BASE_SLICE_NS=1000000    # 1ms base slice for lower context-switch overhead
                                   # Default (2ms) reduces memory pressure but increases latency
                                   # Try 2000000 if you prefer responsiveness over memory savings

# --- CachyOS base tweaks ----------------------------------------------------
CONFIG_CACHY=y

# --- Drop debug info -------------------------------------------------------
# The stock config builds DWARF5 + BTF. Turning that off is the single
# largest saving in both build time and installed size, at the cost of
# BTF-dependent tooling (bpftrace, libbpf CO-RE). See docs/DEBLOAT.md.
#
# 10-strip.conf turns off DEBUG_KERNEL, which removes the whole "Debug
# information" choice -- so there is no DEBUG_INFO_NONE to select here.
# critical-symbols.txt asserts CONFIG_DEBUG_INFO ends up unset.

# --- Memory Pressure: Transparent Hugepages --------------------------------
# Disable transparent hugepages for lower memory footprint.
# THP can consume 20-40 MB extra on idle systems due to page table management.
# Trade-off: slightly worse performance for memory-heavy workloads, but
# interactive workloads on this laptop see minimal impact.
# To re-enable, boot with: transparent_hugepage=madvise
# Or set at runtime: echo madvise > /sys/kernel/mm/transparent_hugepage/enabled
# CONFIG_TRANSPARENT_HUGEPAGE is not set

# --- Out-of-tree modules must keep working ---------------------------------
# broadcom-wl and facetimehd are DKMS modules. Signature enforcement or
# symbol trimming would stop them loading, so both stay off explicitly --
# a refreshed base config must not silently re-enable them.
CONFIG_MODULES=y
# CONFIG_MODULE_SIG_FORCE is not set
# CONFIG_TRIM_UNUSED_KSYMS is not set

# --- Rust ---------------------------------------------------------------
# No in-tree Rust driver applies to 2013 Haswell hardware, and turning it off
# drops rust/rust-bindgen/rust-src from the build dependencies.
# CONFIG_RUST is not set

# --- Compression ------------------------------------------------------------
CONFIG_KERNEL_ZSTD=y
CONFIG_MODULE_COMPRESS=y
CONFIG_MODULE_COMPRESS_ZSTD=y
CONFIG_MODULE_COMPRESS_ALL=y
