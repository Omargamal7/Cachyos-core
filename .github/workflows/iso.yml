# Build the live/install ISO and attach it to a GitHub release.
#
# Takes the kernel packages from the kernel-latest release rather than
# rebuilding them, so this run is minutes rather than hours. Run the
# "Kernel packages" workflow first if that release does not exist yet.
name: ISO

on:
  workflow_dispatch:
    inputs:
      skip_aur:
        description: 'Skip the AUR builds (Chrome, mbpfan, facetimehd)'
        type: boolean
        default: false
  push:
    tags:
      - 'iso-*'

permissions:
  contents: write

jobs:
  build:
    name: Build the MacBookAir6,2 ISO
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --privileged
    steps:
      - name: Free up disk space
        run: |
          # The image needs roughly 8 GB: a 4 GB root filesystem, the ~950 MB
          # squashfs, the 1.2 GB ISO and the package cache in between. The
          # runner's tool cache is the only large thing visible from inside
          # the container.
          rm -rf /__t/CodeQL /__t/Java_Temurin-Hotspot_jdk /__t/PyPy /__t/Ruby \
                 /__t/go /__t/node /__t/Python || true
          df -h /

      - uses: actions/checkout@v4

      - name: Add the CachyOS repository
        run: |
          pacman-key --init
          curl -fsSL -o /tmp/cachyos-keyring.pkg.tar.zst \
            "$(curl -fsSL https://mirror.cachyos.org/repo/x86_64/cachyos/ \
               | grep -oE 'cachyos-keyring-[0-9][^"]*\.pkg\.tar\.zst' | grep -v sig | head -1 \
               | sed 's|^|https://mirror.cachyos.org/repo/x86_64/cachyos/|')"
          pacman -U --noconfirm /tmp/cachyos-keyring.pkg.tar.zst
          pacman-key --populate cachyos
          sed -i '/^\[core\]$/i [cachyos]\nServer = https://mirror.cachyos.org/repo/$arch/$repo\n' /etc/pacman.conf
          pacman -Syu --noconfirm

      - name: Install ISO tooling
        run: |
          pacman -S --noconfirm --needed archiso mkinitcpio-archiso squashfs-tools \
            libisoburn dosfstools erofs-utils grub edk2-shell git jq

      - name: Fetch the prebuilt kernel packages
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p prebuilt-kernel
          # Download through each asset's API url with
          # "Accept: application/octet-stream", not its browser_download_url.
          # The latter redirects to the release-assets CDN, which rejects a
          # request still carrying GitHub's Authorization header -- a failure
          # that depends on redirect handling rather than anything in the repo.
          assets=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/releases/tags/kernel-latest" \
            | jq -r '.assets[] | select(.name | endswith(".pkg.tar.zst")) | "\(.url) \(.name)"')
          if [ -z "$assets" ]; then
            echo "::error::No kernel packages on the kernel-latest release. Run the 'Kernel packages' workflow first."
            exit 1
          fi
          while read -r url name; do
            echo "downloading $name"
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
                 -H "Accept: application/octet-stream" \
                 -o "prebuilt-kernel/$name" "$url"
          done <<< "$assets"
          ls -lh prebuilt-kernel/

      - name: Create build user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chmod -R a+rw .

      - name: Build the ISO
        run: |
          args="--kernel-dir=$PWD/prebuilt-kernel"
          if [ "${{ inputs.skip_aur }}" = "true" ]; then args="$args --skip-aur"; fi
          SUDO_USER=builder bash ./iso/build.sh $args

      - name: Checksum
        run: |
          cd out
          sha256sum ./*.iso | tee SHA256SUMS
          ls -lh

      - name: Disk usage after the build
        if: always()
        run: df -h /

      - uses: actions/upload-artifact@v4
        with:
          name: mba62-iso
          path: out/*
          retention-days: 14

      - name: Publish to the iso-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: iso-latest
          name: Live/install ISO for MacBookAir6,2
          body: |
            Bootable live image with the GUI installer.

            **Write it to a USB stick** (replace `sdX` with your stick, and
            note this erases it):

                sudo dd if=cachyos-core-mba62-*.iso of=/dev/sdX bs=4M status=progress oflag=sync

            **Boot it**: plug the stick into the MacBook Air, power on holding
            the Option key, and pick the orange EFI Boot entry.

            The installer starts by itself. It installs exactly what you are
            running from the stick, so no network is needed.

            Verify the download against `SHA256SUMS`.
          files: |
            out/*.iso
            out/SHA256SUMS
          fail_on_unmatched_files: true
