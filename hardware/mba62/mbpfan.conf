# Fan control for the single fan on a MacBookAir6,2, via applesmc.
#
# Stock firmware only ramps the fan once the CPU is already hot, which on a
# fanless-ish chassis means thermal throttling under sustained load. These
# thresholds start the fan earlier and more gradually.
#
# Verify the sensor names on your machine first:
#     sensors
#     cat /sys/devices/platform/applesmc.768/fan1_min
[general]
low_temp = 55
high_temp = 66
max_temp = 84
polling_interval = 5
