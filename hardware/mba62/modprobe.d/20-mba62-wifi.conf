# Wi-Fi: this machine has a Broadcom BCM4360 (14e4:43a0).
#
# No in-tree driver handles it -- brcmfmac covers 43602/4350/4356 and
# friends, not 4360 -- so it needs the proprietary broadcom-wl module.
# Confirm what you actually have first:
#
#     lspci -nn | grep -i net
#
# If it reports 14e4:43ba / 14e4:43a3 / 14e4:4365 you have a different card
# and should use brcmfmac instead: comment this file out and remove
# broadcom-wl-dkms.
blacklist b43
blacklist b43legacy
blacklist brcmsmac
blacklist brcmfmac
blacklist bcma
blacklist ssb
