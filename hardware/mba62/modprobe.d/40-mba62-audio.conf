# Audio: Cirrus Logic CS4208 behind Intel Lynx Point-LP HDA.
#
# No model= override is needed. The kernel matches this machine by codec
# SSID (0x106b:0x7200, "MacBookAir 6,2") in
# sound/hda/codecs/cirrus/cs420x.c and applies the CS4208_MBA6 fixup
# automatically.
#
# Only if headphone/speaker switching misbehaves, force it:
#     options snd_hda_intel model=mba6
#
# Power saving costs a click on the speakers when the codec wakes up.
options snd_hda_intel power_save=0
