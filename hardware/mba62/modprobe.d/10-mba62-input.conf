# MacBookAir6,2 keyboard and trackpad
#
# fnmode: 0 = disabled, 1 = fkeyslast, 2 = fkeysfirst, 3 = auto (kernel
# default), 4 = fkeysdisabled.
#   1 -- media keys are primary, Fn+F1..F12 gives F1..F12 (what macOS does)
#   2 -- F1..F12 are primary, Fn+F1 gives brightness down
options hid_apple fnmode=1

# iso_layout swaps backtick/tilde with greater-than/less-than on ISO
# keyboards. -1 lets the driver decide from the keyboard's product id;
# set to 1 if your ` and § keys come out swapped.
options hid_apple iso_layout=-1

# swap_opt_cmd: 0 = Mac layout (Cmd next to space acts as Super),
# 1 = PC layout. Leave at 0 unless you want PC muscle memory.
options hid_apple swap_opt_cmd=0
