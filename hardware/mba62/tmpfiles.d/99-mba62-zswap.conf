# Turn zswap off -- /etc/tmpfiles.d/99-mba62-zswap.conf
#
# zswap is a compressed cache that sits in front of a swap device. Ours is
# zram, which is already compressed, so leaving zswap enabled compresses every
# page twice and spends RAM on a pool in front of a pool.
#
# The ISO's installed systems get `zswap.enabled=0` on the kernel command line
# from /etc/calamares/modules/bootloader-mba62.conf. That is not available when
# these pieces are added to an existing CachyOS install by
# hardware/mba62/install.sh: the bootloader belongs to that system, not to us,
# and rewriting somebody's kernel command line is not this script's business.
#
# So the same result is reached through a file we do own. CONFIG_ZSWAP is
# built in, so /sys/module/zswap/parameters is present from early boot, and the
# parameter is writable at runtime (module_param_cb, mode 0644, in mm/zswap.c).
#
# Check it took: cat /sys/module/zswap/parameters/enabled   (want N)
w /sys/module/zswap/parameters/enabled - - - - N
