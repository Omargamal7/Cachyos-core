# Memory settings for zram swap -- /etc/sysctl.d/99-mba62-memory.conf
#
# These four are the Arch Wiki's zram recommendations (wiki.archlinux.org/title/Zram),
# which in turn take them from Pop!_OS. They are not general-purpose "make it
# faster" knobs: each one is wrong for swap on a disk and right for swap in RAM.
# Semantics below are quoted from Documentation/admin-guide/sysctl/vm.rst.

# How strongly reclaim prefers evicting anonymous memory over page cache.
# The default of 60 is tuned for swap on a physical device, where paging out
# costs I/O; swapping to zram costs a decompression instead. The kernel's own
# documentation recommends values beyond 100 for in-memory swap, and clamps
# this to MAX_SWAPPINESS = 200 (include/linux/swap.h).
vm.swappiness = 180

# Swap read-ahead, as a logarithm: 0 means one page, the default 3 means eight.
# Reading eight pages ahead amortises a seek on a disk. There is no seek here,
# so the extra seven decompressions are pure latency. "Zero disables swap
# readahead completely" -- vm.rst.
vm.page-cluster = 0

# Watermark boosting reclaims extra memory when pageblocks get fragmented, to
# improve the odds of future high-order allocations (THP, SLUB). The default
# 15000 means up to 150% of the high watermark. On a 4 GB machine that is a
# large, repeated reclaim burst in service of allocations this workload is not
# making; 0 turns the boosting off.
vm.watermark_boost_factor = 0

# How much headroom kswapd keeps, in fractions of 10,000. The default 10 puts
# only 0.1% of memory between the watermarks, which on 4 GB is a few MB -- so
# allocations keep overrunning kswapd and fall into direct reclaim, which
# stalls the allocating thread. 125 (1.25%) gives kswapd room to work ahead of
# the workload rather than in its path. Maximum is 3000.
vm.watermark_scale_factor = 125
