# Wellspring8 trackpad (bcm5974), via libinput.
#
# The trackpad on this machine reports as a touchpad with physical-button
# semantics, so clickfinger is the behaviour that matches the hardware:
# one finger = left click, two = right, three = middle.
Section "InputClass"
    Identifier "MacBookAir6,2 trackpad"
    MatchIsTouchpad "on"
    MatchDriver "libinput"
    Option "Tapping" "on"
    Option "TappingDrag" "on"
    Option "NaturalScrolling" "true"
    Option "ScrollMethod" "twofinger"
    Option "ClickMethod" "clickfinger"
    Option "DisableWhileTyping" "true"
    Option "AccelProfile" "adaptive"
EndSection
