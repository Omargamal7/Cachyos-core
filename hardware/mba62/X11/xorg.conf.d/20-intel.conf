# Intel HD Graphics 5000 (Haswell GT3).
#
# xorg-server's built-in modesetting driver handles this fine and is what
# upstream recommends for Haswell and newer. TearFree removes tearing
# without a compositor; picom in the Openbox autostart covers the rest.
#
# If you install xf86-video-intel instead, delete this file -- the two
# drivers fight over the device and X will fail to start.
Section "Device"
    Identifier "Intel Graphics"
    Driver "modesetting"
    Option "TearFree" "true"
    Option "DRI" "3"
EndSection
