# zram swap -- /etc/systemd/zram-generator.conf
#
# This machine has 4 GB of soldered LPDDR3 and, as installed, no swap at all:
# the Calamares profile creates none, and CONFIG_ZSWAP_DEFAULT_ON=y in the
# CachyOS base config does nothing without a swap device behind it. With Chrome
# open that leaves the kernel one option under pressure -- evict page cache
# until there is none left, then call the OOM killer.
#
# Needs the zram-generator package (extra/zram-generator); the installer pulls
# it in. Takes effect on the next boot, or immediately with:
#
#   systemctl daemon-reload && systemctl start systemd-zram-setup@zram0.service
#
# Check it came up with `zramctl` and `swapon --show`.

[zram0]
# 2 GB of swap on a 4 GB machine. This is also zram-generator's own default
# (min(ram / 2, 4096)), spelled out so that changing it is a one-line edit
# rather than an archaeology exercise. The device is virtual: 2 GB of swap
# costs whatever the compressed pages actually occupy, not 2 GB of RAM.
zram-size = ram / 2

# Matches CONFIG_ZRAM_DEF_COMP="zstd" in the kernel config. zstd fits more
# pages per byte of RAM than lzo-rle but spends more CPU per page, which is a
# genuine trade on a two-core Haswell-ULT.
#
# Neither has been measured on this machine. scripts/mba62-bench.sh reports
# both halves of that trade -- the compression ratio from /sys/block/zram0
# and the memory stall time from PSI -- so switch to lzo-rle and re-run it
# before assuming zstd is the right choice here.
compression-algorithm = zstd
